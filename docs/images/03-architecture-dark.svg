nce</text><line x1="928.0" y1="534.0" x2="1432.0" y2="534.0" stroke="#2c2c2a" stroke-width="1" stroke-linecap="butt"/><circle cx="936.0" cy="560.0" r="2.5" fill="#898781"/><text x="952.0" y="565.0" fill="#c3c2b7" font-family="Inter,'Helvetica Neue',Helvetica,Arial,'DejaVu Sans',sans-serif" font-size="16" font-weight="400" text-anchor="start">same algorithm, no JIT</text><circle cx="936.0" cy="586.0" r="2.5" fill="#898781"/><text x="952.0" y="591.0" fill="#c3c2b7" font-family="Inter,'Helvetica Neue',Helvetica,Arial,'DejaVu Sans',sans-serif" font-size="16" font-weight="400" text-anchor="start">runs if numba is absent or raises</text><circle cx="936.0" cy="612.0" r="2.5" fill="#898781"/><text x="952.0" y="617.0" fill="#c3c2b7" font-family="Inter,'Helvetica Neue',Helvetica,Arial,'DejaVu Sans',sans-serif" font-size="16" font-weight="400" text-anchor="start">the readable definition of correct</text><circle cx="936.0" cy="638.0" r="2.5" fill="#898781"/><text x="952.0" y="643.0" fill="#c3c2b7" font-family="Inter,'Helvetica Neue',Helvetica,Arial,'DejaVu Sans',sans-serif" font-size="16" font-weight="400" text-anchor="start">cross-checked against the numba path</text><circle cx="936.0" cy="664.0" r="2.5" fill="#898781"/><text x="952.0" y="669.0" fill="#c3c2b7" font-family="Inter,'Helvetica Neue',Helvetica,Arial,'DejaVu Sans',sans-serif" font-size="16" font-weight="400" text-anchor="start">never flagged a game in production</text><text x="928.0" y="712.0" fill="#c3c2b7" font-family="'SF Mono',Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="30" font-weight="600" text-anchor="start">58 k</text><text x="928.0" y="734.0" fill="#898781" font-family="Inter,'Helvetica Neue',Helvetica,Arial,'DejaVu Sans',sans-serif" font-size="14" font-weight="400" text-anchor="start">nodes / sec</text><text x="1130.0" y="712.0" fill="#c3c2b7" font-family="'SF Mono',Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="30" font-weight="600" text-anchor="start">6</text><text x="1130.0" y="734.