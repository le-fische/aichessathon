[project]
name = "aichessathon-starter"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "chess==1.11.2",
    "numpy==2.5.2",
    "numba==0.67.0",
    "torch==2.13.0",
    "onnxruntime==1.29.0",
]

[tool.uv]
package = false

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[dependency-groups]
dev = ["mypy>=1.18", "ruff>=0.14"]

[tool.ruff]
line-length = 100
target-version = "py312"
# runs/ is the archived measurement record, not source we maintain: one-off
# probe scripts kept for reproducibility. Linting them makes the gate red for
# reasons that have nothing to do with the engine, and a permanently red gate
# is how an undefined-constant NameError once reached a measurement run.
extend-exclude = ["runs", "gui_engines", "versions", "baseline", "tools", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]
ignore = ["N818"]

[tool.mypy]
strict = true
files = ["agent.py", "search.py", "evaluation.py", "bitboard.py", "harness"]
